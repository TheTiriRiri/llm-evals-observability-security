[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-ai-workshop-labs"
version = "0.1.0"
description = "Hands-on labs for AI Evals, Observability, and Security"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.9.0",
    "pytest>=8.3.0",
    # Lab 2 uses the OpenTelemetry-based SDK API (start_as_current_observation,
    # propagate_attributes, score_current_trace). Tested on 5.2; bump deliberately.
    "langfuse>=5.0,<6",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
# Flat layout with several top-level lab packages: list them explicitly,
# otherwise setuptools auto-discovery refuses to build.
packages = [
    "lab1_evals_and_judge",
    "lab2_observability",
    "lab3_ci_gate",
    "lab4_threat_modeling",
    "lab5_attack_and_harden",
    "lab6_guardrails_and_redteam",
    "solutions",
]

[tool.pytest.ini_options]
testpaths = ["lab3_ci_gate", "lab6_guardrails_and_redteam"]
# Lets `pytest` (not only `python -m pytest`) resolve `lab6_guardrails_and_redteam.*`
# imports even if the editable install was skipped.
pythonpath = ["."]
